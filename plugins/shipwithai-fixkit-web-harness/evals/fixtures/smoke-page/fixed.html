<!doctype html>
<!-- smoke fixture (FIXED): the healthy twin of broken.html. Each of the 5 measures should
     report ok:true here. The two files together prove the helpers have correct polarity. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>web-harness smoke — fixed</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    /* FIX: wrap long lines so content never exceeds its box. */
    #code {
      width: 280px;
      white-space: pre-wrap;      /* the fix: pre -> pre-wrap */
      overflow-wrap: anywhere;
      overflow-x: auto;
      border: 1px solid #ccc;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>web-harness smoke fixture (fixed)</h1>

  <pre id="code">const reallyLongIdentifier = someFunctionThatReturnsAValue(withSeveralArguments, thatDoNotWrap, atAll);</pre>

  <button id="save">Save</button>
  <span id="status">idle</span>

  <!-- scroll-read-state target: enables past 25% read (the fix wires a scroll listener). -->
  <button id="react" disabled>React</button>

  <!-- tall spacer so the document is scrollable (scrollHeight > clientHeight). -->
  <div style="height: 3000px"></div>

  <script>
    // FIX: no console error on load.
    // FIX: #save is wired -> clicking it sets #status to 'saved'.
    document.getElementById('save').addEventListener('click', function () {
      document.getElementById('status').textContent = 'saved';
    });
    // FIX: scroll-spy — #react enables once the reader passes 25% of the scrollable height.
    var react = document.getElementById('react');
    function syncReact() {
      var se = document.scrollingElement || document.documentElement;
      var ratio = se.scrollTop / Math.max(1, se.scrollHeight - se.clientHeight);
      if (ratio >= 0.25) react.disabled = false;
    }
    window.addEventListener('scroll', syncReact);
    syncReact();
  </script>
</body>
</html>
