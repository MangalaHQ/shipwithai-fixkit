name: Web runner Playwright smoke (Tier C)

# Tier C (split-gate, plan §6): the default plugin gate (validate-plugin.yml) runs the web
# adapter's tests/run-all.js with Playwright ABSENT, so its Tier-B smoke SKIPs and CI stays
# zero-dependency deterministic. THIS job installs Playwright and runs the SAME gate with the
# browser present, so the live runner is actually exercised in CI — but only on changes to the
# web plugin (which bundles the runner since 0.3.0). It does not gate other plugins and never
# affects the deterministic default green.

on:
  pull_request:
    paths:
      - 'plugins/shipwithai-fixkit-web/**'
      - '.github/workflows/harness-smoke.yml'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Playwright is a documented PREREQUISITE, not a repo dependency — installed here ad hoc into
      # a throwaway dir OUTSIDE the repo tree, never vendored or added to a package manifest at the
      # repo root (the repo stays zero-dependency; no package.json is introduced into the checkout).
      - name: Install Playwright + Chromium (out-of-tree)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Run the web gate (deterministic tiers + live Tier B)
        env:
          # Resolve the out-of-tree Playwright for the zero-package-json repo. The gate's
          # run-or-skip probe is a plain require.resolve, which honors NODE_PATH; drive.js itself
          # tries the invoking cwd first (no node_modules at the checkout root here) and falls back
          # to the same NODE_PATH resolution. Absent this, the gate would SKIP Tier B and still pass.
          NODE_PATH: /tmp/pw/node_modules
        run: node plugins/shipwithai-fixkit-web/tests/run-all.js
